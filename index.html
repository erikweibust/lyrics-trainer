<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Trainer — Sonnet 18</title>
<style>
  :root {
    --bg: #f6f3ec;
    --card: #fffdf8;
    --ink: #2c2a26;
    --muted: #6f695f;
    --past-near: #6b6459;
    --past-far: #7a7466;
    --accent: #7c5c3e;
    --accent-ink: #fffdf8;
    --edge: rgba(44, 42, 38, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card: #262320;
      --ink: #ece7dd;
      --muted: #9a9186;
      --past-near: #a8a094;
      --past-far: #9a9186;
      --accent: #c8a179;
      --accent-ink: #1c1a17;
      --edge: rgba(236, 231, 221, 0.14);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 40px 36px 32px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: normal;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #stack {
    margin: 30px 0 0;
    transition: opacity 160ms ease;
  }

  #stack.fading { opacity: 0; }

  .past {
    margin: 0 0 6px;
    min-height: 1.5em;
    font-size: 1.05rem;
    line-height: 1.5;
  }

  /* The older line sits a step further back in both tone and size. */
  #past-2 { color: var(--past-far); font-size: 0.97rem; }
  #past-1 { color: var(--past-near); }

  #line {
    margin: 14px 0 30px;
    min-height: 2.9em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    line-height: 1.45;
  }

  @media (prefers-reduced-motion: reduce) {
    #stack { transition: none; }
  }

  #counter {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  /* Reserves its line whether or not there is an end to announce, so the
     buttons never jump when the note appears. */
  #edge {
    margin: 0 0 16px;
    min-height: 1.2em;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    font-family: system-ui, sans-serif;
  }

  button {
    font: inherit;
    font-size: 1rem;
    letter-spacing: 0.04em;
    padding: 12px 34px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: transform 80ms ease, filter 120ms ease;
  }

  #controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }

  /* A spent direction stays in place so the row does not shift under the
     pointer. Both buttons are the same accent when live, so "off" has to be
     unmistakable: the color drains out as well as fading. */
  button:disabled {
    opacity: 0.3;
    filter: grayscale(1);
    cursor: default;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  #hint {
    margin: 20px 0 0;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: system-ui, sans-serif;
  }

  @media (max-width: 480px) {
    main { padding: 28px 20px 24px; }
    button { padding: 12px 24px; }
    #line { font-size: 1.3rem; }
    .past { font-size: 0.95rem; }
  }
</style>
</head>
<body>
  <main>
    <h1>Sonnet 18 &middot; Shakespeare</h1>
    <div id="stack">
      <p class="past" id="past-2"></p>
      <p class="past" id="past-1"></p>
      <p id="line" aria-live="polite"></p>
    </div>
    <p id="counter"></p>
    <p id="edge" role="status" aria-live="polite"></p>
    <div id="controls">
      <button id="prev" type="button">Previous</button>
      <button id="next" type="button">Next</button>
    </div>
    <p id="hint">Press Space, Enter, or &rarr; for the next line, &larr; to go back</p>
  </main>

<script type="module" src="main.js"></script>
</body>
</html>
