<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Trainer — Sonnet 18</title>
<style>
  :root {
    --bg: #f6f3ec;
    --card: #fffdf8;
    --ink: #2c2a26;
    --muted: #6f695f;
    --past-near: #6b6459;
    --past-far: #7a7466;
    --accent: #7c5c3e;
    --accent-ink: #fffdf8;
    --edge: rgba(44, 42, 38, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --card: #262320;
      --ink: #ece7dd;
      --muted: #9a9186;
      --past-near: #a8a094;
      --past-far: #9a9186;
      --accent: #c8a179;
      --accent-ink: #1c1a17;
      --edge: rgba(236, 231, 221, 0.14);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 40px 36px 32px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 0.78rem;
    font-weight: normal;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  #stack {
    margin: 30px 0 0;
    transition: opacity 160ms ease;
  }

  #stack.fading { opacity: 0; }

  .past {
    margin: 0 0 6px;
    min-height: 1.5em;
    font-size: 1.05rem;
    line-height: 1.5;
  }

  /* The older line sits a step further back in both tone and size. */
  #past-2 { color: var(--past-far); font-size: 0.97rem; }
  #past-1 { color: var(--past-near); }

  #line {
    margin: 14px 0 30px;
    min-height: 2.9em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    line-height: 1.45;
  }

  @media (prefers-reduced-motion: reduce) {
    #stack { transition: none; }
  }

  #counter {
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 22px;
  }

  button {
    font: inherit;
    font-size: 1rem;
    letter-spacing: 0.04em;
    padding: 12px 34px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
    transition: transform 80ms ease, filter 120ms ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  #hint {
    margin: 20px 0 0;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: system-ui, sans-serif;
  }

  @media (max-width: 480px) {
    main { padding: 28px 20px 24px; }
    #line { font-size: 1.3rem; }
    .past { font-size: 0.95rem; }
  }
</style>
</head>
<body>
  <main>
    <h1>Sonnet 18 &middot; Shakespeare</h1>
    <div id="stack">
      <p class="past" id="past-2"></p>
      <p class="past" id="past-1"></p>
      <p id="line" aria-live="polite"></p>
    </div>
    <p id="counter"></p>
    <button id="next" type="button">Next</button>
    <p id="hint">Press Space, Enter, or &rarr; for the next line</p>
  </main>

<script>
  const lines = [
    "Shall I compare thee to a summer's day?",
    "Thou art more lovely and more temperate:",
    "Rough winds do shake the darling buds of May,",
    "And summer's lease hath all too short a date;",
    "Sometime too hot the eye of heaven shines,",
    "And often is his gold complexion dimm'd;",
    "And every fair from fair sometime declines,",
    "By chance or nature's changing course untrimm'd;",
    "But thy eternal summer shall not fade,",
    "Nor lose possession of that fair thou ow'st;",
    "Nor shall Death brag thou wander'st in his shade,",
    "When in eternal lines to time thou grow'st:",
    "So long as men can breathe or eyes can see,",
    "So long lives this, and this gives life to thee."
  ];

  const stackEl = document.getElementById("stack");
  const lineEl = document.getElementById("line");
  const past1El = document.getElementById("past-1");
  const past2El = document.getElementById("past-2");
  const counterEl = document.getElementById("counter");
  const nextBtn = document.getElementById("next");

  const FADE_MS = 160;
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

  // Bump the version suffix if the shape of the stored value ever changes.
  const STORAGE_KEY = "line-trainer:sonnet-18:v1";

  // FNV-1a. Not cryptographic, and it does not need to be: a collision would
  // only mean resuming at the wrong line of a poem that was swapped out.
  function fingerprint(text) {
    let h = 0x811c9dc5;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(36);
  }

  // A saved position only means anything against the text it was saved from.
  // Bounds alone would happily resume mid-way through a different poem of the
  // same length, so the text itself is what the stored index is checked against.
  const signature = fingerprint(lines.join("\n"));

  // localStorage is not guaranteed. Safari refuses it outright on file://
  // origins, and private browsing or blocked site data can throw anywhere.
  // Resuming is a convenience, so every failure falls back to a fresh start
  // rather than breaking the trainer.
  function loadIndex() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw === null) return 0;
      const saved = JSON.parse(raw);
      if (!saved || saved.sig !== signature) return 0;
      const i = saved.index;
      if (!Number.isInteger(i) || i < 0 || i >= lines.length) return 0;
      return i;
    } catch (e) {
      return 0;
    }
  }

  function saveIndex(i) {
    try {
      window.localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({ index: i, sig: signature })
      );
    } catch (e) {
      // Quota, private mode, or a file:// origin: carry on without saving.
    }
  }

  let index = loadIndex();
  let fadeTimer = null;

  // The two lines already recited stay above the focus line, lightest first.
  // A fresh pass through the sonnet starts with an empty history.
  function render(i) {
    past2El.textContent = i >= 2 ? lines[i - 2] : "";
    past1El.textContent = i >= 1 ? lines[i - 1] : "";
    lineEl.textContent = lines[i];
    counterEl.textContent = "Line " + (i + 1) + " of " + lines.length;
  }

  function next() {
    const target = (index + 1) % lines.length;
    index = target;
    saveIndex(target);

    clearTimeout(fadeTimer);
    fadeTimer = null;

    if (reduceMotion.matches) {
      stackEl.classList.remove("fading");
      render(target);
      return;
    }

    stackEl.classList.add("fading");
    fadeTimer = setTimeout(function () {
      render(target);
      stackEl.classList.remove("fading");
      fadeTimer = null;
    }, FADE_MS);
  }

  nextBtn.addEventListener("click", next);

  document.addEventListener("keydown", function (e) {
    if (e.repeat) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") {
      e.preventDefault();
      next();
    }
  });

  render(index);
</script>
</body>
</html>
